---
# Configuration du frontend Zabbix
zabbix_db_host: localhost
zabbix_db_port: "0"
zabbix_db_name: zabbix
zabbix_db_user: zabbix

# Identité du serveur dans l'interface Web
zabbix_server_name: Zabbix-Lab

# Fuseau horaire de référence
zabbix_timezone: Africa/Dakar

# Configuration du frontend
zabbix_frontend_config_path: /etc/zabbix/web/zabbix.conf.php
zabbix_frontend_config_owner: www-data
zabbix_frontend_config_group: www-data
zabbix_frontend_config_mode: "0600"
